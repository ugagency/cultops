<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestaí — Solicitantes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        /* Página neutra — sem sidebar de módulo. */
        body { background-color: var(--bg-main); }
        .neutral-shell {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
        }
        .neutral-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .neutral-back:hover { color: var(--text-primary); }

        .gestao-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .glass-card {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 2rem;
            border: 1px solid var(--border-light);
            transition: var(--transition);
        }

        .glass-card:hover {
            box-shadow: var(--shadow-lg);
            border-color: var(--color-primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 1.5rem;
            align-items: end;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr; }
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.6rem;
            color: var(--text-primary);
        }

        .form-control, .form-select {
            width: 100%;
            padding: 0.875rem 1.25rem;
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            background: #fff;
        }

        .form-control:focus, .form-select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(21, 71, 255,0.1);
        }

        .solic-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        .solic-table th {
            text-align: left;
            padding: 1rem;
            background: var(--bg-sidebar);
            color: var(--text-secondary);
            font-weight: 700;
            border-bottom: 2px solid var(--border-light);
        }

        .solic-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
            vertical-align: middle;
        }

        .solic-table tr:hover td { background: var(--bg-sidebar); }

        .btn-remove {
            background: var(--color-alert);
            color: white;
            border: none;
            padding: 0.5rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-remove:hover { opacity: 0.85; }

        .empty-state-inline {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="neutral-shell">
        <button class="neutral-back" onclick="history.back()">
            <i data-lucide="arrow-left" style="width: 16px;"></i> Voltar
        </button>

        <div class="gestao-container">
            <div>
                <h1 style="font-size: 2.5rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem;">Gestão de Solicitantes</h1>
                <p style="color: var(--text-secondary); font-size: 1.125rem;">Autorize fornecedores e parceiros a enviar comprovantes e evidências diretamente para seus projetos.</p>
            </div>

            <!-- Vincular Novo Solicitante -->
            <section class="glass-card" style="border-top: 5px solid var(--color-primary);">
                <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem;">
                    <i data-lucide="user-plus" style="color: var(--color-primary); width: 24px; height: 24px;"></i>
                    <h3 style="font-size: 1.25rem; font-weight: 700;">Vincular Solicitante</h3>
                </div>

                <form id="vincular-form">
                    <div class="form-row">
                        <div class="form-group" style="margin: 0;">
                            <label>Selecione o Projeto</label>
                            <select id="select-projeto" class="form-select" required>
                                <option value="">Carregando projetos...</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin: 0;">
                            <label>Selecione o Solicitante</label>
                            <select id="select-fornecedor" class="form-select" required>
                                <option value="">Carregando solicitantes...</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary" id="btn-vincular" style="height: 52px; min-width: 140px; justify-content: center;">
                            Vincular
                        </button>
                    </div>
                </form>
            </section>

            <!-- Lista de Solicitantes Vinculados -->
            <section class="glass-card">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <i data-lucide="users" style="color: var(--text-primary); width: 24px; height: 24px;"></i>
                        <h3 style="font-size: 1.25rem; font-weight: 700;">Solicitantes Ativos</h3>
                    </div>
                </div>

                <div style="overflow-x: auto;">
                    <table class="solic-table">
                        <thead>
                            <tr>
                                <th>Solicitante (Razão Social / CNPJ)</th>
                                <th>Projeto Vinculado</th>
                                <th style="text-align: center;">Data de Vínculo</th>
                                <th style="text-align: center;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="vinculos-tbody">
                            <tr><td colspan="4" class="empty-state-inline"><i data-lucide="loader" class="spin"></i> Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="config.js"></script>
    <script>
        let sbClient = null;
        let currentUser = null;

        async function initSupabase() {
            if (sbClient) return sbClient;
            sbClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
            return sbClient;
        }

        function showToast(msg, type = 'success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast toast-${type}`;
            t.innerHTML = `<div class="toast-content"><p class="toast-message">${msg}</p></div>`;
            c.appendChild(t);
            setTimeout(() => {
                t.classList.add('fade-out');
                setTimeout(() => t.remove(), 300);
            }, 3500);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.lucide) window.lucide.createIcons();

            const sb = await initSupabase();
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'index.html#login'; return; }

            // Página neutra: guard de role no carregamento (mesmo padrão do
            // menu escondido != página protegida usado em M2/M3).
            const role = session.user?.app_metadata?.role || session.user?.user_metadata?.role;
            if (!['admin', 'gestor'].includes(role)) {
                window.location.href = 'module-selector.html';
                return;
            }

            try {
                const { data: { user } } = await sb.auth.getUser();
                currentUser = user;

                await carregarProjetos();
                await carregarFornecedores();
                await carregarVinculos();

                document.getElementById('vincular-form').addEventListener('submit', handleVincular);
            } catch (err) {
                console.error('Erro na inicialização:', err);
                showToast('Erro ao carregar os dados.', 'error');
            }

            if (window.lucide) window.lucide.createIcons();
        });

        async function carregarProjetos() {
            const sb = await initSupabase();
            const select = document.getElementById('select-projeto');
            const { data, error } = await sb.from('projects')
                .select('id, nome, pronac')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                select.innerHTML = '<option value="">Nenhum projeto encontrado.</option>';
                return;
            }

            select.innerHTML = '<option value="">Selecione um projeto...</option>' +
                data.map(p => `<option value="${p.id}">${p.nome} (PRONAC: ${p.pronac})</option>`).join('');
        }

        async function carregarFornecedores() {
            const sb = await initSupabase();
            const select = document.getElementById('select-fornecedor');
            const { data, error } = await sb.from('fornecedores')
                .select('id, razao_social, cnpj')
                .order('razao_social');

            if (error || !data || data.length === 0) {
                select.innerHTML = '<option value="">Nenhum solicitante cadastrado na plataforma.</option>';
                return;
            }

            select.innerHTML = '<option value="">Selecione um solicitante...</option>' +
                data.map(f => `<option value="${f.id}">${f.razao_social} (${f.cnpj})</option>`).join('');
        }

        async function carregarVinculos() {
            const sb = await initSupabase();
            const tbody = document.getElementById('vinculos-tbody');

            const { data: vinculos, error } = await sb.from('projeto_fornecedores')
                .select('*, fornecedores(razao_social, cnpj), projects(nome)')
                .eq('gestor_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state-inline" style="color:var(--error);">Erro ao carregar vínculos.</td></tr>`;
                return;
            }

            if (!vinculos || vinculos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state-inline">Nenhum solicitante vinculado aos seus projetos ainda.</td></tr>`;
                return;
            }

            tbody.innerHTML = vinculos.map(v => `
                <tr>
                    <td>
                        <div style="font-weight: 600;">${v.fornecedores?.razao_social || 'Desconhecido'}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">${v.fornecedores?.cnpj || ''}</div>
                    </td>
                    <td style="font-weight: 500;">${v.projects?.nome || 'Desconhecido'}</td>
                    <td style="text-align: center;">${new Date(v.created_at).toLocaleDateString('pt-BR')}</td>
                    <td style="text-align: center;">
                        <button class="btn-remove" onclick="removerVinculo('${v.id}')" title="Remover Vínculo">
                            <i data-lucide="trash-2" style="width: 18px; height: 18px;"></i>
                        </button>
                    </td>
                </tr>
            `).join('');

            if (window.lucide) window.lucide.createIcons();
        }

        async function handleVincular(e) {
            e.preventDefault();
            const sb = await initSupabase();
            const btn = document.getElementById('btn-vincular');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader" class="spin"></i>';
            btn.disabled = true;

            try {
                const projectId = document.getElementById('select-projeto').value;
                const fornecedorId = document.getElementById('select-fornecedor').value;

                if (!projectId || !fornecedorId) throw new Error('Selecione o projeto e o solicitante.');

                const { error } = await sb.from('projeto_fornecedores').insert({
                    project_id: projectId,
                    fornecedor_id: fornecedorId,
                    gestor_id: currentUser.id
                });

                if (error) {
                    if (error.code === '23505') throw new Error('Este solicitante já está vinculado a este projeto.');
                    throw error;
                }

                showToast('Solicitante vinculado com sucesso!', 'success');
                document.getElementById('vincular-form').reset();
                await carregarVinculos();
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                if (window.lucide) window.lucide.createIcons();
            }
        }

        async function removerVinculo(id) {
            if (!confirm('Tem certeza que deseja remover o acesso deste solicitante a este projeto?')) return;
            try {
                const sb = await initSupabase();
                const { error } = await sb.from('projeto_fornecedores').delete().eq('id', id);
                if (error) throw error;

                showToast('Vínculo removido com sucesso.', 'success');
                await carregarVinculos();
            } catch (err) {
                showToast('Erro ao remover: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
