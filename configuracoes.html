<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestaí — Configurações</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        /* Página neutra na raiz do repo, acessível pelos 3 módulos — usa a
           sidebar adaptativa de page-sidebar.js (mostra a variante do módulo
           ativo via prestai_modulo_ativo), não uma sidebar fixa própria. */
        body { background-color: var(--bg-main); }
        .neutral-shell {
            max-width: 1000px;
            padding: 2rem 1.5rem 3rem;
        }
        .neutral-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .neutral-back:hover { color: var(--text-primary); }

        .settings-container { max-width: 800px; margin-top: 1rem; }

        .settings-card {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 2.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-light);
            position: relative;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .card-header h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.6rem;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1.25rem;
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.95rem;
        }

        .status-badge {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .status-badge.connected { background: var(--color-primary); color: var(--color-accent); }
        .status-badge.disconnected { background: var(--color-alert); color: var(--color-white); }
    </style>
</head>
<body>
    <main class="main-content neutral-shell">
        <button class="neutral-back" onclick="history.back()">
            <i data-lucide="arrow-left" style="width: 16px;"></i> Voltar
        </button>

        <div class="dashboard-header" style="margin-bottom: 3rem;">
            <h1 style="font-size: 2.5rem; font-weight: 800;">Configurações</h1>
            <p style="color: var(--text-secondary); font-size: 1.125rem;">Gerencie as credenciais e integrações da sua organização.</p>
        </div>

        <div class="settings-container">
            <!-- Credenciais SALIC -->
            <section class="settings-card" style="border-top: 5px solid var(--color-primary);">
                <div class="card-header">
                    <i data-lucide="key-round" style="color: var(--color-primary);"></i>
                    <h3>Conexão SALIC (Gov.br)</h3>
                    <div class="status-badge disconnected" id="salic-status">Desconectado</div>
                </div>

                <form id="salic-form">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 1.5rem; margin-bottom: 1.5rem;">
                        <div class="form-group">
                            <label>Usuário / CPF</label>
                            <input type="text" id="salic-user" placeholder="000.000.000-00" required>
                        </div>
                        <div class="form-group">
                            <label>Senha</label>
                            <input type="password" id="salic-pass" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-save-salic" style="width: 100%; justify-content: center; height: 50px;">
                        Salvar Credenciais SALIC
                    </button>
                    <p id="salic-credencial-aviso" role="alert" style="display: none; margin-top: 1rem; padding: 0.875rem 1rem; border-radius: var(--radius-md); font-size: 0.875rem; line-height: 1.5;"></p>
                </form>
            </section>

            <!-- Trocar Senha -->
            <section class="settings-card" style="border-top: 5px solid var(--color-primary);">
                <div class="card-header">
                    <i data-lucide="lock" style="color: var(--color-primary);"></i>
                    <h3>Trocar Senha</h3>
                </div>

                <form id="senha-form">
                    <div class="form-group">
                        <label>Senha atual</label>
                        <input type="password" id="senha-atual" placeholder="••••••••" required>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 1.5rem; margin-bottom: 1.5rem;">
                        <div class="form-group">
                            <label>Nova senha</label>
                            <input type="password" id="senha-nova" placeholder="Mínimo 6 caracteres" minlength="6" required>
                        </div>
                        <div class="form-group">
                            <label>Confirmar nova senha</label>
                            <input type="password" id="senha-confirma" placeholder="Repita a senha" minlength="6" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-save-senha" style="width: 100%; justify-content: center; height: 50px;">
                        Salvar Nova Senha
                    </button>
                </form>
            </section>
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>

    <script src="config.js"></script>
    <script src="erros-amigaveis.js"></script>
    <script src="auth-logout.js"></script>
    <script src="page-sidebar.js"></script>
    <script>
        let sbClient = null;
        async function initSupabase() {
            if (sbClient) return sbClient;
            sbClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
            return sbClient;
        }

        function showToast(msg, type = 'success') {
            if (window.prestaiSuavizar) msg = window.prestaiSuavizar(msg, type);
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast toast-${type}`;
            t.innerHTML = `<div class="toast-content"><p class="toast-message">${msg}</p></div>`;
            c.appendChild(t);
            setTimeout(() => {
                t.classList.add('fade-out');
                setTimeout(() => t.remove(), 300);
            }, 3500);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.lucide) window.lucide.createIcons();

            const sb = await initSupabase();
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'index.html#login'; return; }

            // Página neutra: guard de role no carregamento (mesmo padrão do
            // menu escondido != página protegida usado em M2/M3).
            const role = session.user?.app_metadata?.role || session.user?.user_metadata?.role;
            if (!['admin', 'gestor'].includes(role)) {
                window.location.href = 'module-selector.html';
                return;
            }

            await renderPageSidebar(role);

            try {
                await loadCredentials();
            } catch (err) {
                console.error('Erro no carregamento:', err);
            }

            document.getElementById('salic-form').onsubmit = handleSaveSalic;
            document.getElementById('senha-form').onsubmit = handleTrocarSenha;

            const formSalic = document.getElementById('salic-form');
            formSalic.addEventListener('input', checkSalicFormDirty);
            formSalic.addEventListener('change', checkSalicFormDirty);

            if (window.lucide) window.lucide.createIcons();
        });

        const SALIC_FORM_FIELD_IDS = ['salic-user', 'salic-pass'];
        let _salicFormSnapshot = null;
        function getSalicFormSnapshot() {
            const values = {};
            SALIC_FORM_FIELD_IDS.forEach(id => {
                const el = document.getElementById(id);
                values[id] = el ? el.value : '';
            });
            return JSON.stringify(values);
        }
        function markSalicFormClean() {
            _salicFormSnapshot = getSalicFormSnapshot();
            document.getElementById('btn-save-salic').disabled = true;
        }
        function checkSalicFormDirty() {
            document.getElementById('btn-save-salic').disabled = (getSalicFormSnapshot() === _salicFormSnapshot);
        }

        const SENHA_MASCARADA = '********';
        let salicUserSalvo = '';   // identificador hoje gravado (para saber se o CPF mudou)
        let salicOcupado = false;  // teste/salvamento em andamento: ignora duplo clique

        async function loadCredentials() {
            const sb = await initSupabase();
            const { data, error } = await sb.from('external_credentials').select('*').eq('service_name', 'salic');
            salicUserSalvo = '';
            if (data) {
                data.forEach(cred => {
                    if (cred.service_name === 'salic') {
                        salicUserSalvo = cred.identifier || '';
                        document.getElementById('salic-user').value = cred.identifier || '';
                        document.getElementById('salic-pass').value = SENHA_MASCARADA;
                        document.getElementById('salic-status').className = 'status-badge connected';
                        document.getElementById('salic-status').innerText = 'Conectado';
                    }
                });
                if (window.lucide) window.lucide.createIcons();
            }
            markSalicFormClean();
        }

        // --- Validação do login do SALIC antes de salvar (ocorrência #64) ---
        // cpfValido e urlValidarCredencialSalic são cópias das de app.js (handleSaveSettings);
        // a chamada ao worker difere só em usar o cliente Supabase desta página.

        // CPF com 11 dígitos e dígitos verificadores (aceita pontos e traço).
        function cpfValido(valor) {
            const d = String(valor || '').replace(/\D/g, '');
            if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
            const dv = (base) => {
                let soma = 0;
                for (let i = 0; i < base; i++) soma += Number(d[i]) * (base + 1 - i);
                const resto = (soma * 10) % 11;
                return resto === 10 ? 0 : resto;
            };
            return dv(9) === Number(d[9]) && dv(10) === Number(d[10]);
        }

        // Mesma base do worker que o front usa para /api/salic/inserir (CONFIG.SALIC_API_URL).
        // null se a URL configurada não termina em /inserir (não dá para derivar com segurança).
        function urlValidarCredencialSalic() {
            const atual = String(CONFIG.SALIC_API_URL || '');
            if (!/\/inserir\/?$/.test(atual)) return null;
            const url = atual.replace(/\/inserir\/?$/, '/validar-credencial');
            return url.startsWith('/') ? window.location.origin + url : url;
        }

        // Pede ao worker para testar o login no SALIC. Devolve
        // { status: 'ok' | 'invalida' | 'indeterminada' | 'ocupado' | 'limite' | 'indisponivel' | 'sem_sessao', tentarEm? }.
        // 'indisponivel' = rede, 404 de worker sem a rota, erro do servidor, resposta fora do
        // formato ou tempo esgotado. A senha só vai no corpo do POST: nunca em URL, storage ou log.
        async function validarCredencialSalicNoWorker(usuario, senha) {
            const url = urlValidarCredencialSalic();
            if (!url) return { status: 'indisponivel' };
            const sb = await initSupabase();
            const { data: { session } } = await sb.auth.getSession();
            if (!session) return { status: 'sem_sessao' };

            const controle = new AbortController();
            const limite = setTimeout(() => controle.abort(), 100000); // o worker tem 90 s de teto
            try {
                const resposta = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
                    mode: 'cors',
                    signal: controle.signal,
                    body: JSON.stringify({ usuario, senha })
                });
                const corpo = await resposta.json().catch(() => null);
                if (resposta.status === 429 && corpo && (corpo.status === 'ocupado' || corpo.status === 'limite')) {
                    return { status: corpo.status, tentarEm: Number(corpo.tentarEm) || null };
                }
                if (resposta.ok && corpo && ['ok', 'invalida', 'indeterminada'].includes(corpo.status)) {
                    return { status: corpo.status };
                }
                return { status: 'indisponivel' };
            } catch (err) {
                return { status: 'indisponivel' };
            } finally {
                clearTimeout(limite);
            }
        }

        // Aviso persistente sob o botão (escrito com textContent, nunca innerHTML).
        function mostrarAvisoCredencialSalic(texto, tipo) {
            const el = document.getElementById('salic-credencial-aviso');
            if (!el) return;
            el.textContent = texto || '';
            el.style.display = texto ? 'block' : 'none';
            el.style.background = tipo === 'erro' ? 'rgba(220, 38, 38, 0.08)' : 'var(--bg-sidebar)';
            el.style.border = tipo === 'erro' ? '1px solid rgba(220, 38, 38, 0.35)' : '1px solid var(--border-light)';
            el.style.color = tipo === 'erro' ? '#DC2626' : 'var(--text-secondary)';
        }

        // Trava botão e campos durante o teste (pode levar até cerca de 30 s).
        function definirValidandoSalic(ligado) {
            const btn = document.getElementById('btn-save-salic');
            if (ligado) {
                btn.disabled = true;
                btn.innerText = 'Validando no SALIC...';
            } else {
                btn.innerText = 'Salvar Credenciais SALIC';
                checkSalicFormDirty();
            }
            SALIC_FORM_FIELD_IDS.forEach(id => { document.getElementById(id).readOnly = ligado; });
        }

        // Modal simples no estilo da página (sem confirm() do navegador). Resolve true/false.
        function confirmarSalvarSalicMesmoAssim(titulo, mensagem) {
            return new Promise((resolve) => {
                const anteriorFoco = document.activeElement;
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.setAttribute('role', 'dialog');
                overlay.setAttribute('aria-modal', 'true');

                const caixa = document.createElement('div');
                caixa.className = 'modal-content';
                const h = document.createElement('h3');
                h.style.cssText = 'font-size: 1.25rem; font-weight: 700; margin-bottom: 0.75rem;';
                h.textContent = titulo;
                const p = document.createElement('p');
                p.style.cssText = 'color: var(--text-secondary); line-height: 1.5; margin-bottom: 1.5rem;';
                p.textContent = mensagem;
                const linha = document.createElement('div');
                linha.style.cssText = 'display: flex; gap: 0.75rem; justify-content: flex-end; flex-wrap: wrap;';
                const bCancelar = document.createElement('button');
                bCancelar.type = 'button';
                bCancelar.className = 'btn btn-secondary';
                bCancelar.id = 'salic-confirm-cancelar';
                bCancelar.textContent = 'Não salvar';
                const bSalvar = document.createElement('button');
                bSalvar.type = 'button';
                bSalvar.className = 'btn btn-primary';
                bSalvar.id = 'salic-confirm-salvar';
                bSalvar.textContent = 'Salvar mesmo assim';
                linha.append(bCancelar, bSalvar);
                caixa.append(h, p, linha);
                overlay.appendChild(caixa);

                const fechar = (resposta) => {
                    document.removeEventListener('keydown', aoTeclar, true);
                    overlay.remove();
                    if (anteriorFoco && typeof anteriorFoco.focus === 'function') anteriorFoco.focus();
                    resolve(resposta);
                };
                const aoTeclar = (ev) => { if (ev.key === 'Escape') fechar(false); };
                bCancelar.onclick = () => fechar(false);
                bSalvar.onclick = () => fechar(true);
                overlay.addEventListener('click', (ev) => { if (ev.target === overlay) fechar(false); });
                document.addEventListener('keydown', aoTeclar, true);

                document.body.appendChild(overlay);
                bCancelar.focus(); // foco no lado seguro: Enter não salva sem querer
            });
        }

        async function salvarCredencialSalic(user, pass) {
            // Defesa: a máscara (ou vazio) NUNCA pode chegar ao RPC, que grava o que receber.
            if (!pass || pass === SENHA_MASCARADA) {
                showToast('Digite a senha para salvar a credencial SALIC.', 'error');
                return;
            }
            const sb = await initSupabase();
            try {
                const { error } = await sb.rpc('upsert_external_credential', {
                    p_service_name: 'salic',
                    p_identifier: user,
                    p_secret: pass
                });
                if (error) throw error;
                mostrarAvisoCredencialSalic('');
                showToast('Credenciais SALIC salvas!', 'success');
                await loadCredentials();
            } catch (err) {
                showToast('Erro: ' + err.message, 'error');
            }
        }

        async function handleSaveSalic(e) {
            e.preventDefault();
            if (salicOcupado) return; // duplo clique / Enter repetido
            salicOcupado = true;
            try {
                await processarSalvarSalic();
            } finally {
                salicOcupado = false;
            }
        }

        async function processarSalvarSalic() {
            const campoUser = document.getElementById('salic-user');
            const campoPass = document.getElementById('salic-pass');
            const user = campoUser.value.trim();
            const pass = campoPass.value.trim();
            mostrarAvisoCredencialSalic('');

            // 1) CPF no navegador: nem chama o worker com CPF malformado.
            if (!cpfValido(user)) {
                mostrarAvisoCredencialSalic('CPF inválido. Confira os 11 dígitos do CPF e tente de novo.', 'erro');
                showToast('CPF inválido. Confira os 11 dígitos.', 'error');
                return;
            }

            // Senha ainda mascarada: não há senha para testar nem para gravar.
            if (pass === SENHA_MASCARADA) {
                const soDigitos = (v) => String(v || '').replace(/\D/g, '');
                if (soDigitos(user) === soDigitos(salicUserSalvo)) {
                    mostrarAvisoCredencialSalic('Nenhuma alteração: a senha não foi modificada.', 'info');
                    showToast('Nenhuma alteração: a senha não foi modificada.', 'info');
                    return;
                }
                // CPF novo exige a senha daquele CPF: limpa a máscara, destaca o campo e pede de novo.
                mostrarAvisoCredencialSalic('Você alterou o CPF. Digite a senha do SALIC deste CPF novamente para salvar.', 'erro');
                showToast('Digite a senha do SALIC para o novo CPF.', 'error');
                campoPass.value = '';
                campoPass.style.borderColor = 'var(--error)';
                campoPass.addEventListener('input', () => { campoPass.style.borderColor = ''; }, { once: true });
                campoPass.focus();
                return;
            }
            if (!pass) {
                showToast('Digite a senha para salvar a credencial SALIC.', 'error');
                return;
            }

            // 2) Testa o login no SALIC antes de salvar.
            definirValidandoSalic(true);
            let resultado;
            try {
                resultado = await validarCredencialSalicNoWorker(user, pass);
            } finally {
                definirValidandoSalic(false);
            }

            if (resultado.status === 'sem_sessao') {
                showToast('Sessão expirada. Faça login novamente.', 'error');
                return;
            }
            if (resultado.status === 'ok') {
                await salvarCredencialSalic(user, pass);
                return;
            }
            if (resultado.status === 'invalida') {
                // Não salva. A mensagem fica na tela até a próxima tentativa.
                mostrarAvisoCredencialSalic('O SALIC recusou este CPF e senha, e a credencial não foi salva. Confira os dados: o robô usa a senha própria do SALIC, não a entrada pelo gov.br. Evite repetir muitas vezes seguidas, porque isso pode bloquear o seu acesso ao SALIC.', 'erro');
                showToast('O SALIC recusou o login. Credencial não salva.', 'error');
                return;
            }

            // 3) Não foi possível confirmar: só salva com confirmação explícita.
            let motivo = 'Não foi possível testar o login no SALIC agora (o serviço de validação não respondeu).';
            if (resultado.status === 'indeterminada') motivo = 'O teste não conseguiu concluir o login no SALIC agora (o SALIC pode estar lento ou fora do ar).';
            if (resultado.status === 'ocupado') motivo = 'O robô está ocupado com outro processo e não pôde testar o login agora.';
            if (resultado.status === 'limite') {
                const minutos = resultado.tentarEm ? Math.max(1, Math.ceil(resultado.tentarEm / 60)) : null;
                motivo = 'Você já testou o login várias vezes em pouco tempo. Para não bloquear seu acesso ao SALIC, o teste só poderá ser repetido ' + (minutos ? 'em cerca de ' + minutos + ' minuto' + (minutos > 1 ? 's' : '') : 'mais tarde') + '.';
            }
            const confirmou = await confirmarSalvarSalicMesmoAssim(
                'Não foi possível confirmar o login no SALIC',
                motivo + ' Se a senha estiver incorreta, o robô só vai falhar no primeiro envio. Deseja salvar mesmo assim?'
            );
            if (!confirmou) {
                // Devolve o que o usuário tinha digitado.
                campoUser.value = user;
                campoPass.value = pass;
                checkSalicFormDirty();
                return;
            }
            await salvarCredencialSalic(user, pass);
        }

        async function handleTrocarSenha(e) {
            e.preventDefault();
            const sb = await initSupabase();
            const btn = document.getElementById('btn-save-senha');

            const senhaAtual = document.getElementById('senha-atual').value;
            const novaSenha = document.getElementById('senha-nova').value;
            const confirma = document.getElementById('senha-confirma').value;

            if (novaSenha !== confirma) {
                showToast('As senhas não coincidem.', 'error');
                return;
            }
            if (novaSenha.length < 6) {
                showToast('A senha deve ter pelo menos 6 caracteres.', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'SALVANDO...';

            try {
                const { data: { session } } = await sb.auth.getSession();
                const email = session?.user?.email;
                if (!email) throw new Error('Sessão inválida.');

                // Reautentica com a senha atual antes de trocar — updateUser()
                // sozinho não confirma que quem está na sessão sabe a senha antiga.
                const { error: authError } = await sb.auth.signInWithPassword({ email, password: senhaAtual });
                if (authError) throw new Error('Senha atual incorreta.');

                const { error } = await sb.auth.updateUser({ password: novaSenha });
                if (error) throw error;

                showToast('Senha alterada com sucesso!', 'success');
                document.getElementById('senha-form').reset();
            } catch (err) {
                showToast('Erro: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Salvar Nova Senha';
            }
        }
    </script>
</body>
</html>
