<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestaí — Configurações</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        /* Página neutra na raiz do repo, acessível pelos 3 módulos — usa a
           sidebar adaptativa de page-sidebar.js (mostra a variante do módulo
           ativo via prestai_modulo_ativo), não uma sidebar fixa própria. */
        body { background-color: var(--bg-main); }
        .neutral-shell {
            max-width: 1000px;
            padding: 2rem 1.5rem 3rem;
        }
        .neutral-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .neutral-back:hover { color: var(--text-primary); }

        .settings-container { max-width: 800px; margin-top: 1rem; }

        .settings-card {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 2.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-light);
            position: relative;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .card-header h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.6rem;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1.25rem;
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.95rem;
        }

        .status-badge {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .status-badge.connected { background: var(--color-primary); color: var(--color-accent); }
        .status-badge.disconnected { background: var(--color-alert); color: var(--color-white); }
    </style>
</head>
<body>
    <main class="main-content neutral-shell">
        <button class="neutral-back" onclick="history.back()">
            <i data-lucide="arrow-left" style="width: 16px;"></i> Voltar
        </button>

        <div class="dashboard-header" style="margin-bottom: 3rem;">
            <h1 style="font-size: 2.5rem; font-weight: 800;">Configurações</h1>
            <p style="color: var(--text-secondary); font-size: 1.125rem;">Gerencie as credenciais e integrações da sua organização.</p>
        </div>

        <div class="settings-container">
            <!-- Credenciais SALIC -->
            <section class="settings-card" style="border-top: 5px solid var(--color-primary);">
                <div class="card-header">
                    <i data-lucide="key-round" style="color: var(--color-primary);"></i>
                    <h3>Conexão SALIC (Gov.br)</h3>
                    <div class="status-badge disconnected" id="salic-status">Desconectado</div>
                </div>

                <form id="salic-form">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 1.5rem; margin-bottom: 1.5rem;">
                        <div class="form-group">
                            <label>Usuário / CPF</label>
                            <input type="text" id="salic-user" placeholder="000.000.000-00" required>
                        </div>
                        <div class="form-group">
                            <label>Senha</label>
                            <input type="password" id="salic-pass" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-save-salic" style="width: 100%; justify-content: center; height: 50px;">
                        Salvar Credenciais SALIC
                    </button>
                </form>
            </section>

            <!-- Trocar Senha -->
            <section class="settings-card" style="border-top: 5px solid var(--color-primary);">
                <div class="card-header">
                    <i data-lucide="lock" style="color: var(--color-primary);"></i>
                    <h3>Trocar Senha</h3>
                </div>

                <form id="senha-form">
                    <div class="form-group">
                        <label>Senha atual</label>
                        <input type="password" id="senha-atual" placeholder="••••••••" required>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 1.5rem; margin-bottom: 1.5rem;">
                        <div class="form-group">
                            <label>Nova senha</label>
                            <input type="password" id="senha-nova" placeholder="Mínimo 6 caracteres" minlength="6" required>
                        </div>
                        <div class="form-group">
                            <label>Confirmar nova senha</label>
                            <input type="password" id="senha-confirma" placeholder="Repita a senha" minlength="6" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-save-senha" style="width: 100%; justify-content: center; height: 50px;">
                        Salvar Nova Senha
                    </button>
                </form>
            </section>
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>

    <script src="config.js"></script>
    <script src="auth-logout.js"></script>
    <script src="page-sidebar.js"></script>
    <script>
        let sbClient = null;
        async function initSupabase() {
            if (sbClient) return sbClient;
            sbClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
            return sbClient;
        }

        function showToast(msg, type = 'success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast toast-${type}`;
            t.innerHTML = `<div class="toast-content"><p class="toast-message">${msg}</p></div>`;
            c.appendChild(t);
            setTimeout(() => {
                t.classList.add('fade-out');
                setTimeout(() => t.remove(), 300);
            }, 3500);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.lucide) window.lucide.createIcons();

            const sb = await initSupabase();
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'index.html#login'; return; }

            // Página neutra: guard de role no carregamento (mesmo padrão do
            // menu escondido != página protegida usado em M2/M3).
            const role = session.user?.app_metadata?.role || session.user?.user_metadata?.role;
            if (!['admin', 'gestor'].includes(role)) {
                window.location.href = 'module-selector.html';
                return;
            }

            await renderPageSidebar(role);

            try {
                await loadCredentials();
            } catch (err) {
                console.error('Erro no carregamento:', err);
            }

            document.getElementById('salic-form').onsubmit = handleSaveSalic;
            document.getElementById('senha-form').onsubmit = handleTrocarSenha;

            const formSalic = document.getElementById('salic-form');
            formSalic.addEventListener('input', checkSalicFormDirty);
            formSalic.addEventListener('change', checkSalicFormDirty);

            if (window.lucide) window.lucide.createIcons();
        });

        const SALIC_FORM_FIELD_IDS = ['salic-user', 'salic-pass'];
        let _salicFormSnapshot = null;
        function getSalicFormSnapshot() {
            const values = {};
            SALIC_FORM_FIELD_IDS.forEach(id => {
                const el = document.getElementById(id);
                values[id] = el ? el.value : '';
            });
            return JSON.stringify(values);
        }
        function markSalicFormClean() {
            _salicFormSnapshot = getSalicFormSnapshot();
            document.getElementById('btn-save-salic').disabled = true;
        }
        function checkSalicFormDirty() {
            document.getElementById('btn-save-salic').disabled = (getSalicFormSnapshot() === _salicFormSnapshot);
        }

        async function loadCredentials() {
            const sb = await initSupabase();
            const { data, error } = await sb.from('external_credentials').select('*').eq('service_name', 'salic');
            if (data) {
                data.forEach(cred => {
                    if (cred.service_name === 'salic') {
                        document.getElementById('salic-user').value = cred.identifier || '';
                        document.getElementById('salic-pass').value = '********';
                        document.getElementById('salic-status').className = 'status-badge connected';
                        document.getElementById('salic-status').innerText = 'Conectado';
                    }
                });
                if (window.lucide) window.lucide.createIcons();
            }
            markSalicFormClean();
        }

        async function handleSaveSalic(e) {
            e.preventDefault();
            const sb = await initSupabase();
            const btn = document.getElementById('btn-save-salic');
            btn.disabled = true;
            btn.innerText = 'SALVANDO...';

            try {
                const user = document.getElementById('salic-user').value.trim();
                const pass = document.getElementById('salic-pass').value.trim();

                const { error } = await sb.rpc('upsert_external_credential', {
                    p_service_name: 'salic',
                    p_identifier: user,
                    p_secret: pass === '********' ? null : pass
                });

                if (error) throw error;
                showToast('Credenciais SALIC salvas!', 'success');
                await loadCredentials();
            } catch (err) {
                showToast('Erro: ' + err.message, 'error');
            } finally {
                btn.innerText = 'Salvar Credenciais SALIC';
                checkSalicFormDirty();
            }
        }

        async function handleTrocarSenha(e) {
            e.preventDefault();
            const sb = await initSupabase();
            const btn = document.getElementById('btn-save-senha');

            const senhaAtual = document.getElementById('senha-atual').value;
            const novaSenha = document.getElementById('senha-nova').value;
            const confirma = document.getElementById('senha-confirma').value;

            if (novaSenha !== confirma) {
                showToast('As senhas não coincidem.', 'error');
                return;
            }
            if (novaSenha.length < 6) {
                showToast('A senha deve ter pelo menos 6 caracteres.', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'SALVANDO...';

            try {
                const { data: { session } } = await sb.auth.getSession();
                const email = session?.user?.email;
                if (!email) throw new Error('Sessão inválida.');

                // Reautentica com a senha atual antes de trocar — updateUser()
                // sozinho não confirma que quem está na sessão sabe a senha antiga.
                const { error: authError } = await sb.auth.signInWithPassword({ email, password: senhaAtual });
                if (authError) throw new Error('Senha atual incorreta.');

                const { error } = await sb.auth.updateUser({ password: novaSenha });
                if (error) throw error;

                showToast('Senha alterada com sucesso!', 'success');
                document.getElementById('senha-form').reset();
            } catch (err) {
                showToast('Erro: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Salvar Nova Senha';
            }
        }
    </script>
</body>
</html>
